# macOS display harness (ticket #153): `cargo xtask display-harness` on GitHub-hosted macOS runners.
# It creates a 2x and a 1x virtual display, opens the real burl, moves its window between them and
# checks the scale-change lines and the capture sizes, in two scenarios (exact-pixel and
# --high-dpi). NOT a required check: it relies on a private macOS display API, so a runner-image
# update can break it without any Burl change.
name: display-harness
on:
  pull_request:
    paths:
      - ".github/workflows/display-harness.yml"
      - "tools/display-harness/**"
      - "xtask/src/display_harness.rs"
      - "xtask/src/crisp_control.rs"
      - "xtask/src/main.rs"
      - "xtask/src/pixels.rs"
      - "xtask/src/ssim.rs"
      - "crates/burl/src/interactive.rs"
      - "crates/burl-gl/**"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-harness-${{ github.ref }}
  # Only PR runs are superseded; a scheduled or manual run must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  harness:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One image breaking must not hide the other; drop an image when GitHub retires it.
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Drift record: the runner image labels move, so log which macOS build this leg really ran on.
      # Informational only: every lookup is guarded and the step cannot fail the job.
      - name: Record macOS build and runner image
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          name="$(sw_vers -productName 2>/dev/null || echo unknown)"
          version="$(sw_vers -productVersion 2>/dev/null || echo unknown)"
          build="$(sw_vers -buildVersion 2>/dev/null || echo unknown)"
          arch="$(uname -m 2>/dev/null || echo unknown)"
          {
            echo "runner label: ${MATRIX_OS:-unknown}"
            echo "macOS: $name $version ($build)"
            echo "arch: $arch"
            echo "ImageOS: ${ImageOS:-unset}"
            echo "ImageVersion: ${ImageVersion:-unset}"
          } | tee "${RUNNER_TEMP:-/tmp}/image-info.txt"
          {
            echo "### Runner image (${MATRIX_OS:-unknown})"
            echo '```'
            cat "${RUNNER_TEMP:-/tmp}/image-info.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
      - run: cargo xtask display-harness
        env:
          # Compares against tools/display-harness/baselines/<image> (regression baseline, not parity).
          DISPLAY_HARNESS_BASELINE: ${{ matrix.os }}
      # The --high-dpi scenario (#162): logical-size window, sizes and a golden-free crispness check.
      # Runs even if the first scenario failed, so one failure does not hide the other.
      - run: cargo xtask display-harness --high-dpi
        if: ${{ !cancelled() }}
      # Cursor grab (draft): click the background, post motion, read the cursor back. Needs no
      # virtual display; separate so a failure here does not hide the display scenarios.
      - run: cargo xtask display-harness --grab
        if: ${{ !cancelled() }}
      # Real title-bar drag between the displays (mouse.m, CGEventPost). First hosted run is the
      # experiment: whether the synthetic drag moves the window across the virtual displays.
      - run: cargo xtask display-harness --drag
        if: ${{ !cancelled() }}
      # Paused 1x -> 2x -> 1x drag round trip: the window must show the same frame afterwards.
      # First hosted run is the experiment (see tools/display-harness/README.md).
      - run: cargo xtask display-harness --roundtrip
        if: ${{ !cancelled() }}
      # Real negative control for the crispness check: a non-hi-res OpenGL window magnified by the
      # compositor on the 2x display (lowres.m). Experiment: prints both scores and capture sizes.
      - run: cargo xtask crisp-control
        if: ${{ !cancelled() }}
      # Always kept: a passing run's captures are what the regression baselines are taken from.
      - name: Keep the captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: display-harness-${{ matrix.os }}
          path: |
            target/display-harness/*.png
            target/display-harness/burl.out
            target/display-harness-high-dpi/*.png
            target/display-harness-high-dpi/burl.out
            target/display-harness-grab/burl.out
            target/display-harness-drag/burl.out
            target/display-harness-drag/vd.out
            target/display-harness-roundtrip/*.png
            target/display-harness-roundtrip/burl.out
            target/display-harness-roundtrip/vd.out
            target/crisp-control/*.png
            target/crisp-control/*.out
          if-no-files-found: ignore
          retention-days: 7

  # Canary: a failed SCHEDULED run (runner-image drift, usually) opens or updates one issue.
  # `needs.harness.result` is 'failure' if any matrix leg failed; success/cancelled/skipped do nothing.
  notify-on-schedule-failure:
    name: notify on scheduled failure
    needs: harness
    if: ${{ always() && github.event_name == 'schedule' && needs.harness.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "display-harness: the weekly macOS run failed"
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --limit 100 \
            --json number,title | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "The weekly run failed again on $today: $RUN_URL"
          else
            body="The weekly display-harness run failed on $today: $RUN_URL

          The harness (\`cargo xtask display-harness\`) creates virtual displays on hosted macOS runners and checks that Burl's window moves between them. It uses a private macOS API (CGVirtualDisplay), so a runner-image update can break it with no Burl change. It is not a required check.

          Check first:
          - Read the failed step's log in the run above.
          - Compare \`target/display-harness*/burl.out\` in the run's uploaded artifacts.
          - See the Caveats section of tools/display-harness/README.md."
            gh issue create --title "$TITLE" --body "$body"
          fi
