# Heavy tier (ticket #13): Docker-based gates. Today: rebuild the oracle in the pinned image
# and check the committed goldens reproduce, plus the slow Burl-only tests. The simulation goldens are
# recaptured from the state-dump fork the same way. The headless render smoke (#15, #19) runs on llvmpipe; the structural SSIM visual gate (#12) runs Burl in the same kind of image.
name: heavy
on:
  pull_request:
    paths: [".github/workflows/heavy.yml", "tests/golden/**", "docs/rust-rewrite/discovery/golden/**", "docker/**", "reference/**", "src/**", "crates/burl-gl/**", "crates/burl-render/**", "scripts/render-smoke.sh", "scripts/visual-burl.sh", "scripts/window-xvfb.sh", "scripts/window-in-container.sh", "docker/release.Dockerfile", "xtask/**", "crates/**", "data/**"]
  # Tests the merged result: two PRs can each pass and still break master together (#104-era).
  push:
    branches: [master]
    paths: [".github/workflows/heavy.yml", "tests/golden/**", "docs/rust-rewrite/discovery/golden/**", "docker/**", "reference/**", "src/**", "crates/burl-gl/**", "crates/burl-render/**", "scripts/render-smoke.sh", "scripts/visual-burl.sh", "scripts/window-xvfb.sh", "scripts/window-in-container.sh", "docker/release.Dockerfile", "xtask/**", "crates/**", "data/**"]
  # Lets a GitHub merge queue (repo setting, #95) run this tier on the queued merge. merge_group
  # does not support `paths`, so every queued merge runs it.
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.ref }}
  # Only PR runs are superseded; a newer master push must not cancel the run testing an earlier merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  goldens-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # src/core is a submodule; the oracle build needs it (pinned by the superproject)
          submodules: true
      - name: Rebuild the oracle and recapture every golden
        run: bash docs/rust-rewrite/discovery/golden/scripts/regen.sh
      - name: Goldens must be unchanged
        # PROVENANCE.txt records the image id, which differs per build, so it is excluded.
        run: |
          git add -A -- tests/golden docs/rust-rewrite/discovery/golden
          git diff --cached --exit-code -- . ':!tests/golden/PROVENANCE.txt'

  sim-goldens-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild the state-dump fork and recapture every simulation golden
        run: bash docs/rust-rewrite/discovery/golden/scripts/regen-sim.sh
      - name: Simulation goldens must be unchanged
        # PROVENANCE.txt records the image id, which differs per build, so it is excluded.
        run: |
          git add -A -- tests/golden/sim
          git diff --cached --exit-code -- tests/golden/sim ':!tests/golden/sim/PROVENANCE.txt'

  slow-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --release --workspace -- --ignored

  render-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headless render smoke (Docker, Mesa llvmpipe)
        run: bash scripts/render-smoke.sh

  visual-ssim:
    # Blocking (visual-gate.md "What blocks"): one real x86 run scored 0.979 to 1.000 against 0.959.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the structural fixtures with Burl and SSIM them against tests/golden/visual
        # explicit shell: bash adds pipefail, so a failing gate is not hidden by `| tee`
        shell: bash
        run: bash scripts/visual-burl.sh 0.959 | tee "$RUNNER_TEMP/ssim.txt"
      - name: Report per-frame SSIM
        if: ${{ !cancelled() }}
        run: |
          { echo '```'; cat "$RUNNER_TEMP/ssim.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Bloom set, report only (SSIM and mean luma per frame, luminance limit 5%)
        # BLOOM=1 never fails the job; bloom luminance is non-blocking (visual-gate.md "What blocks")
        # !cancelled(): still measure after a structural failure, which stays blocking via its own step
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          BLOOM=1 bash scripts/visual-burl.sh 0.959 | tee "$RUNNER_TEMP/bloom.txt"
          { echo '### Bloom (report only)'; echo '```'; cat "$RUNNER_TEMP/bloom.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  window-xvfb:
    # Linux X11 half of the interactive checklist: the real window under Xvfb + openbox, driven
    # with xdotool (docker/window.Dockerfile). macOS Retina/non-Retina stay manual.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Window checks (Docker, Xvfb, llvmpipe)
        run: bash scripts/window-xvfb.sh target/window-xvfb
      - name: Keep the screenshots and the session recording
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-xvfb
          path: target/window-xvfb
