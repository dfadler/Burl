# Release (ticket #21, #14): runs on release tags only. Nothing is published until a human
# step passes: scripts/check-release.sh (the user's interactive sign-off and the reviewed
# deviation register must be in the tagged commit) and the `release` environment, which must
# be configured with the user as required reviewer. Artifacts are a DRAFT GitHub release
# (the user publishes it) and the headless image on ghcr. A tag with a hyphen (v0.58.0-rc.1)
# is a dry run: no sign-off needed, prerelease draft, image without the `latest` tag.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: User sign-off and reviewed deviation register
        # Release candidates (tag contains a hyphen) skip the sign-off, never the final tag.
        if: ${{ !contains(github.ref_name, '-') }}
        run: bash scripts/check-release.sh "$GITHUB_REF_NAME"

  heavy:
    needs: gate
    uses: ./.github/workflows/heavy.yml

  build:
    needs: gate
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04 }
          - { target: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo xtask ci
      - run: cargo build --release --locked -p burl
      - name: Third-party licence list
        # cargo-deny pinned and locked; `list` prints every dependency's licence.
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny list --layout crate --format human > THIRD-PARTY-LICENSES.txt
      - name: Package
        env:
          NAME: burl-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp target/release/burl COPYING dist/NOTICE.md THIRD-PARTY-LICENSES.txt "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.target }}
          path: burl-*.tar.gz*
          if-no-files-found: error

  image:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the headless image
        run: docker build --platform linux/amd64 -t burl:release -f docker/release.Dockerfile .
      - name: Image exports a valid PPM stream for a fixture
        run: bash scripts/check-image.sh burl:release
      - run: docker save burl:release -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          if-no-files-found: error

  publish:
    # Every gate green, then the `release` environment's required reviewer (the user) approves.
    needs: [gate, heavy, build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Push the image to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          docker load -i dl/image/image.tar
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          ref="ghcr.io/${REPO,,}"
          tags=("${GITHUB_REF_NAME#v}")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(latest) ;; esac
          for t in "${tags[@]}"; do
            docker tag burl:release "$ref:$t"
            docker push "$ref:$t"
          done
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--draft --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dl/tarball-*/*
