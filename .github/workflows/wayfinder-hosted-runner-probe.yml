name: wayfinder hosted-runner probe
# Throwaway: answers whether hosted macOS runners have a window server, screen capture and virtual displays,
# and whether the real burl builds and renders there.
on:
  push:
    branches: [wayfinder/hosted-runner-probe]
permissions:
  contents: read
jobs:
  burl:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Burl on virtual displays
        run: ./probe/burl.sh
