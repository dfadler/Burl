[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.57.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dfadler/Burl"

[workspace.dependencies]
gnarl-util = { path = "crates/gnarl-util" }
gnarl-conf = { path = "crates/gnarl-conf" }
gnarl-formats = { path = "crates/gnarl-formats" }
gnarl-sim = { path = "crates/gnarl-sim" }
gnarl-render = { path = "crates/gnarl-render" }
gnarl-gl = { path = "crates/gnarl-gl" }
# One glam for the whole workspace (the sim pins the same version).
glam = "=0.34.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "0.20"
pcre2 = "0.2"
# Windowed path pins from the headless spike (#15); one winit for the whole tree.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
