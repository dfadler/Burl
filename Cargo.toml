[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.57.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dfadler/Gnarl"
homepage = "https://github.com/dfadler/Gnarl"
# Floor: the code uses slice::as_chunks (1.88; clippy incompatible_msrv enforces this in CI) and fontdue needs 1.87.
rust-version = "1.88"

[workspace.dependencies]
# Path + version: the path is used in the workspace, the version when published. The release PR
# bumps these with [workspace.package] version (`cargo build --locked` fails loudly if they differ).
gnarl-util = { path = "crates/gnarl-util", version = "=0.57.0" }
gnarl-conf = { path = "crates/gnarl-conf", version = "=0.57.0" }
gnarl-formats = { path = "crates/gnarl-formats", version = "=0.57.0" }
gnarl-sim = { path = "crates/gnarl-sim", version = "=0.57.0" }
gnarl-render = { path = "crates/gnarl-render", version = "=0.57.0" }
gnarl-gl = { path = "crates/gnarl-gl", version = "=0.57.0" }
# One glam for the whole workspace (the sim pins the same version).
glam = "=0.34.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "0.20"
pcre2 = "0.2"
# Windowed path pins from the headless spike (#15); one winit for the whole tree.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
