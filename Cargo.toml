[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.57.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dfadler/Burl"

[workspace.dependencies]
burl-util = { path = "crates/burl-util" }
burl-conf = { path = "crates/burl-conf" }
burl-formats = { path = "crates/burl-formats" }
burl-sim = { path = "crates/burl-sim" }
burl-render = { path = "crates/burl-render" }
burl-gl = { path = "crates/burl-gl" }
# One glam for the whole workspace (the sim pins the same version).
glam = "=0.34.2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "0.20"
pcre2 = "0.2"
