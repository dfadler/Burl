[package]
name = "burl-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Burl: CPU-side render batches in Gource's fixed pass order (no GL)"

[dependencies]
glam.workspace = true
burl-util.workspace = true
burl-sim.workspace = true
fontdue = "0.9.5"
jpeg-decoder = { version = "0.3.2", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
