[package]
name = "burl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Burl: the application binary (build session 1: --output-custom-log only)"

[[bin]]
name = "burl"
path = "src/main.rs"

[dependencies]
burl-util.workspace = true
burl-conf.workspace = true
burl-formats.workspace = true
