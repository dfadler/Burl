[package]
name = "gnarl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Gnarl: a Rust port of Gource, the software version control visualization (windowed and headless frame export)"
readme = "README.md"
keywords = ["gource", "visualization", "git", "opengl", "version-control"]
categories = ["visualization", "command-line-utilities"]
include = ["LICENSE", "src/**", "README.md"]

[[bin]]
name = "gnarl"
path = "src/main.rs"

[dependencies]
gnarl-util.workspace = true
gnarl-conf.workspace = true
gnarl-formats.workspace = true
gnarl-sim.workspace = true
gnarl-render.workspace = true
gnarl-gl.workspace = true

[features]
# PCRE2 for the user filters (look-around, backreferences); the CI pcre2 leg runs the gate with it.
pcre2 = ["gnarl-conf/pcre2"]

[dev-dependencies]
# The sim gate test reads the committed fork goldens through the xtask comparator.
xtask = { path = "../../xtask" }
