[graph]
all-features = true

[advisories]
# fontdue (ticket #19 item 3) parses fonts with ttf-parser, which is unmaintained but has no known
# vulnerability. Replace with skrifa-based text if fontdue does not move off it.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
# Burl is GPL-3.0-or-later; only GPL-compatible licences may enter the tree.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "GPL-3.0-or-later", "Unlicense", "CC0-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
