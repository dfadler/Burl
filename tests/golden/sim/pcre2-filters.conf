[gource]
title=Look-behind: hide util.* outside src/
file-filter=(?<!src/)util\.(cpp|h)
stop-at-time=3

[gource]
title=Backreference: hide names with a repeated e
file-filter=(e)[a-z]*\1
stop-at-time=3

[gource]
title=Look-ahead: show only src/*.cpp
file-show-filter=^(?=src/).*\.cpp$
stop-at-time=3

[gource]
title=Negative look-ahead on the user: only Bob
user-filter=^(?!Bob$)
stop-at-time=3
